<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>The Blissfull Bites</title><link id="bb-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@500;600;700;800&family=Fraunces:ital,opsz,wght,SOFT,WONK@1,9..144,700,100,1&family=Poiret+One&display=swap"><style id="bb-css">/* Layout: breezy-blue hero with floating product cutouts -> flamingo wave band -> cream "baked in Delhi" -> beach-blue gingham menu of colour-tile cards -> flamingo "what others say" reel -> blue custom-order CTA -> navy footer. Single bright look by design (Hot Planet palette). */
:root{
  --blue:#3548C0; --blue-deep:#26338F; --sunny:#FDF196; --butter:#F3D985; --flamingo:#F19DAA; --flamingo-soft:#FBD9DE;
  --beach:#B9D1FB; --beach-soft:#E3EDFE; --navy:#1C2370; --cream:#FFFBF0; --white:#FFFFFF; --line:#DCE4F7;
  --display:"Bowlby One","Arial Black",Impact,system-ui,sans-serif;
  --deco:"Poiret One","Futura","Century Gothic",system-ui,sans-serif;
  --script:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --gutter:clamp(16px,4vw,48px);
  color-scheme:light;
}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--cream);color:var(--navy);font-family:var(--body);font-size:16px;line-height:1.55;font-weight:500;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--flamingo);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1;text-wrap:balance;margin:0;text-transform:uppercase;letter-spacing:.005em}
.wrap{max-width:1200px;margin-inline:auto;padding-inline:var(--gutter)}
.it{font-family:var(--script);font-style:italic;font-weight:700;text-transform:none;letter-spacing:0;font-variation-settings:"SOFT" 100,"WONK" 1}
.eyebrow{font-weight:800;text-transform:uppercase;letter-spacing:.18em;font-size:.76rem}
.deco{font-family:var(--deco);font-weight:400;text-transform:uppercase;letter-spacing:.08em}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--cream) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--blue);margin-right:auto;font-family:var(--deco);font-size:clamp(1.05rem,2.6vw,1.45rem);letter-spacing:.06em;font-weight:400;line-height:1;text-transform:uppercase}
.logo b{font-weight:400;color:var(--flamingo);-webkit-text-stroke:.5px var(--flamingo)}
.logo svg{width:32px;height:32px;flex:none}
.nav{display:flex;gap:22px}
.nav a{color:var(--navy);text-decoration:none;font-weight:700;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase}
.nav a:hover{color:var(--blue)}
@media (max-width:860px){.nav{display:none}}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:9px 16px;font-weight:800;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border:2px solid var(--navy);white-space:nowrap}
.cart-btn{background:var(--white);color:var(--navy)}
.cart-btn .count{background:var(--flamingo);color:var(--navy);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.78rem;letter-spacing:0;font-variant-numeric:tabular-nums}
.wa-top{background:var(--sunny);color:var(--navy)}
@media (max-width:520px){.wa-top{display:none}}
.bump{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.12)}60%{transform:scale(.96)}}

/* hero */
.hero{background:var(--blue);color:var(--white);position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1fr 1.02fr;align-items:center;gap:24px;padding-block:clamp(36px,6vw,76px) clamp(70px,9vw,110px);position:relative;z-index:1}
.hero-copy{min-width:0}
.tag{display:inline-flex;gap:8px;align-items:center;background:var(--flamingo);color:var(--navy);border-radius:999px;padding:6px 14px}
.hero h1{font-size:clamp(2.6rem,6.6vw,5.3rem);color:var(--sunny);margin-top:20px;line-height:.95}
.hero h1 .it{color:var(--flamingo);font-size:1.12em;display:inline-block;transform:rotate(-3deg)}
.hero .lede{font-size:clamp(1.02rem,1.6vw,1.18rem);max-width:36ch;margin:20px 0 26px;color:var(--beach-soft)}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:14px 26px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.84rem;text-decoration:none;border:2px solid var(--navy);transition:transform .15s,box-shadow .15s}
.btn-sun{background:var(--sunny);color:var(--navy);box-shadow:4px 4px 0 var(--navy)}
.btn-sun:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--navy)}
.btn-line{background:transparent;color:var(--white);border-color:var(--white)}
.btn-line:hover{background:rgba(255,255,255,.12)}
.btn-blue{background:var(--blue);color:var(--white);box-shadow:4px 4px 0 var(--navy)}
.btn-blue:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--navy)}
.btn-white{background:var(--white);color:var(--navy)}
.thumbs{display:flex;align-items:center;gap:10px;margin-top:26px}
.thumbs span{width:52px;height:52px;border-radius:50%;background:var(--white);border:3px solid var(--sunny);overflow:hidden;display:grid;place-items:center}
.thumbs img{width:88%;height:88%;object-fit:contain}
.thumbs em{font-family:var(--script);font-style:italic;color:var(--beach);font-size:1.05rem}
.hero-art{position:relative;aspect-ratio:1/0.95;width:100%;max-width:580px;justify-self:center}
.sun{position:absolute;width:44%;aspect-ratio:1;border-radius:50%;background:var(--sunny);right:4%;top:2%}
.arch{position:absolute;left:12%;right:10%;bottom:4%;top:16%;background:var(--flamingo);border-radius:999px 999px 40px 40px;border:3px solid var(--navy)}
.arch::after{content:"";position:absolute;inset:12px;border-radius:inherit;border:2px dashed rgba(28,35,112,.35)}
.obj{position:absolute;filter:drop-shadow(0 18px 16px rgba(20,24,80,.38));animation:bob 6s ease-in-out infinite}
.obj img{width:100%;height:auto}
@keyframes bob{50%{transform:translateY(-10px) rotate(var(--r,2deg))}}
.o-tira{width:52%;left:20%;top:22%;animation-delay:-1s}
.o-bowl{width:40%;right:-2%;bottom:-2%;--r:-3deg}
.o-cookie{width:30%;left:-2%;top:6%;--r:6deg;animation-delay:-2.5s}
.o-cake{width:28%;left:0;bottom:2%;animation-delay:-4s}
.spark{position:absolute;color:var(--sunny);width:30px}
.spark svg{width:100%;height:auto;display:block}
.sp1{left:46%;top:6%;width:26px}.sp2{right:2%;top:48%;width:20px;color:var(--white)}.sp3{left:8%;top:52%;width:18px;color:var(--flamingo)}
.badge{position:absolute;right:-1%;top:4%;width:27%;aspect-ratio:1;animation:spin 20s linear infinite;z-index:2}
.badge text{font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:2.6px;fill:var(--navy)}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-dots{position:absolute;inset:0;background-image:radial-gradient(rgba(185,209,251,.22) 1.6px,transparent 1.8px);background-size:26px 26px;pointer-events:none}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}.hero-art{max-width:440px}}

/* wavy band */
.band{position:relative;z-index:2;margin-top:-56px}
.wave{display:block;width:100%;height:56px}
.wave path{fill:var(--flamingo)}
.marquee{background:var(--flamingo);overflow:hidden;white-space:nowrap;padding-block:4px 16px;color:var(--navy)}
.marquee-track{display:inline-flex;gap:26px;animation:slide 36s linear infinite;font-weight:800;letter-spacing:.2em;font-size:.86rem;text-transform:uppercase}
.marquee-track span{display:inline-flex;gap:26px;align-items:center}
.marquee-track i{font-style:normal;color:var(--blue)}
@keyframes slide{to{transform:translateX(-50%)}}
.wave2{display:block;width:100%;height:40px;transform:scaleY(-1);margin-top:-1px}
.wave2 path{fill:var(--flamingo)}

section.block{padding-block:clamp(48px,7vw,96px)}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px 24px;margin-bottom:28px}
.head h2{font-size:clamp(2.2rem,5.4vw,4rem);color:var(--navy)}
.head h2 .it{color:var(--blue)}
.head p{margin:10px 0 0;font-weight:600;max-width:46ch;color:var(--blue-deep)}
.kicker{font-family:var(--script);font-style:italic;color:var(--blue);font-size:1.05rem;display:block;margin-bottom:6px}

/* about */
.about .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(24px,5vw,64px);align-items:center}
.about-copy{min-width:0}
.about-copy h2{font-size:clamp(2.2rem,5vw,3.8rem)}
.about-copy h2 .it{color:var(--blue)}
.about-copy p{max-width:52ch;font-weight:500}
.about-copy a{color:var(--blue);font-weight:800}
.collage{position:relative;aspect-ratio:1.1;max-width:520px;width:100%;justify-self:center}
.collage figure{position:absolute;margin:0;border:3px solid var(--navy);overflow:hidden;background:var(--white);box-shadow:6px 6px 0 var(--navy)}
.collage img{width:100%;height:100%;object-fit:cover}
.c1{left:0;top:6%;width:48%;aspect-ratio:3/4;border-radius:999px 999px 24px 24px;transform:rotate(-4deg)}
.c2{right:2%;top:0;width:46%;aspect-ratio:1;border-radius:50%;transform:rotate(3deg)}
.c3{right:10%;bottom:0;width:44%;aspect-ratio:4/3;border-radius:28px;transform:rotate(-2deg)}
.stamp{position:absolute;left:34%;bottom:6%;width:26%;aspect-ratio:1;border-radius:50%;background:var(--sunny);border:3px solid var(--navy);display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:clamp(.7rem,1.6vw,.95rem);line-height:1.05;transform:rotate(-10deg);text-transform:uppercase;padding:8px;box-sizing:border-box}
@media (max-width:860px){.about .wrap{grid-template-columns:1fr}}
.facts{background:var(--beach);border-block:2px solid var(--navy)}
.facts ul{list-style:none;margin:0;padding:18px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.facts li{display:flex;gap:12px;align-items:center;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;min-width:0}
.facts li+li{border-left:2px solid rgba(28,35,112,.18);padding-left:14px}
.facts svg{width:38px;height:38px;flex:none}
@media (max-width:820px){.facts ul{grid-template-columns:1fr 1fr}.facts li+li{border-left:0;padding-left:0}}

/* menu */
.menu{background-color:var(--beach-soft);background-image:linear-gradient(90deg,rgba(53,72,192,.09) 50%,transparent 50%),linear-gradient(rgba(53,72,192,.09) 50%,transparent 50%);background-size:44px 44px}
.menu .head{background:var(--white);border:2px solid var(--navy);border-radius:28px;padding:22px 24px;box-shadow:6px 6px 0 var(--blue)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;max-width:100%}
.chip{flex:none;border:2px solid var(--navy);background:var(--white);border-radius:999px;padding:7px 15px;font-weight:800;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--blue);color:var(--white);border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px}
.card{background:var(--white);border:2px solid var(--navy);border-radius:30px;padding:10px;display:flex;flex-direction:column;gap:12px;min-width:0;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.tile{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:1/0.86;background:var(--sunny)}
.card:nth-child(4n+2) .tile{background:var(--flamingo)}
.card:nth-child(4n+3) .tile{background:var(--beach)}
.card:nth-child(4n+4) .tile{background:var(--butter)}
.tile img,.tile svg{width:100%;height:100%;object-fit:cover}
.tile.contain img,.tile.contain svg{object-fit:contain;padding:9%;box-sizing:border-box;filter:drop-shadow(0 14px 12px rgba(20,24,80,.3));transition:transform .3s}
.card:hover .tile.contain img{transform:scale(1.05) rotate(-2deg)}
.tile::before{content:"";position:absolute;left:-12%;bottom:-30%;width:70%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.35)}
.tile.cover::before{display:none}
.soldout{position:absolute;left:50%;top:12px;transform:translateX(-50%) rotate(-3deg);background:var(--navy);color:var(--sunny);font-weight:800;border-radius:999px;padding:4px 14px;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;z-index:1}
.card-body{display:flex;flex-direction:column;gap:10px;padding:2px 8px 8px;flex:1}
.card h3{font-size:1.32rem;color:var(--navy)}
.card .desc{margin:-4px 0 0;color:var(--blue-deep);font-size:.9rem;font-weight:600}
.sizes{display:inline-flex;background:var(--beach-soft);border-radius:999px;padding:3px;gap:2px;align-self:flex-start;max-width:100%;overflow-x:auto}
.size{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:800;font-size:.8rem}
.size[aria-pressed="true"]{background:var(--blue);color:var(--white)}
.flavors{display:flex;flex-wrap:wrap;gap:6px}
.flavor{border:1.5px solid var(--flamingo);background:var(--white);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:700;display:flex;gap:6px;align-items:baseline;color:var(--navy)}
.flavor small{font-weight:600;opacity:.75;font-variant-numeric:tabular-nums}
.flavor[aria-pressed="true"]{background:var(--flamingo-soft);border-color:var(--navy)}
.card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:8px}
.price{font-family:var(--display);font-size:1.6rem;color:var(--blue);font-variant-numeric:tabular-nums}
.add{border:2px solid var(--navy);background:var(--blue);color:var(--white);border-radius:999px;padding:9px 16px;font-weight:800;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
.add.in{background:var(--sunny);color:var(--navy)}
.add:disabled{opacity:.45;cursor:not-allowed}
.empty-note{grid-column:1/-1;background:var(--white);border:2px dashed var(--navy);border-radius:20px;padding:28px;text-align:center;font-weight:600}

/* reviews */
.reviews{background:var(--flamingo);border-radius:clamp(40px,10vw,140px) clamp(40px,10vw,140px) 0 0;margin-top:-40px;position:relative}
.reviews .head h2{color:var(--white);-webkit-text-stroke:1.5px var(--navy);paint-order:stroke fill;text-shadow:4px 4px 0 var(--navy)}
.reviews .head p{color:var(--navy)}
.reel{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 4px 20px;scrollbar-width:thin}
.reel>*{scroll-snap-align:start;flex:none}
.review{width:280px;min-height:300px;border-radius:30px;border:2px solid var(--navy);background:var(--white);overflow:hidden;display:flex;flex-direction:column;box-shadow:5px 5px 0 var(--navy)}
.review .who{display:flex;align-items:center;gap:10px;padding:16px 18px 6px;font-weight:800}
.review .av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);background:var(--sunny);border:2px solid var(--navy);text-transform:uppercase}
.review:nth-child(3n+2) .av{background:var(--beach)}
.review:nth-child(3n+3) .av{background:var(--flamingo-soft)}
.review .who small{display:block;font-weight:600;color:var(--blue);font-size:.78rem}
.stars{color:var(--blue);letter-spacing:3px;padding:0 18px;font-size:1.05rem}
.review blockquote{margin:0;padding:10px 18px 20px;font-size:1.02rem;line-height:1.5;font-weight:500}
.review img{width:100%;flex:1;min-height:0;object-fit:cover;border-top:2px solid var(--flamingo-soft)}
.review.empty{background:var(--cream);border-style:dashed;justify-content:center;padding:24px;gap:12px;box-shadow:none}
.review.empty h3{font-size:1.35rem}
.ig-link{color:var(--blue);font-weight:800}

/* custom CTA */
.custom{background:var(--blue);color:var(--white);text-align:center;position:relative;overflow:hidden}
.custom h2{color:var(--sunny);font-size:clamp(2.2rem,6vw,4.4rem)}
.custom h2 .it{color:var(--flamingo)}
.custom p{max-width:50ch;margin:16px auto 26px;color:var(--beach-soft);font-size:1.08rem}
.custom .ring{position:absolute;border-radius:50%;border:2px dashed rgba(253,241,150,.4)}

/* footer */
footer{background:var(--navy);color:var(--beach-soft);padding-block:56px 32px}
.word{font-family:var(--deco);color:var(--flamingo);font-size:clamp(2.2rem,8.4vw,6.6rem);line-height:1;margin:0 0 30px;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.foot-row{display:flex;flex-wrap:wrap;gap:20px 48px}
.foot-row a{color:var(--sunny)}
.foot-row .lbl{color:var(--beach);display:block;margin-bottom:4px}
.tiny{font-size:.85rem;opacity:.85;margin-top:30px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid rgba(185,209,251,.25);padding-top:18px}
.tiny a{color:var(--beach-soft)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(28,35,112,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--cream);z-index:61;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;border-left:2px solid var(--navy);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--blue);color:var(--sunny);border-bottom:2px solid var(--navy)}
.drawer-head h2{font-size:1.6rem}
.x{border:2px solid var(--navy);background:var(--white);color:var(--navy);border-radius:50%;width:38px;height:38px;font-weight:800;font-size:1.1rem;line-height:1;display:grid;place-items:center;text-decoration:none}
.drawer-body{overflow-y:auto;padding:16px 18px;flex:1;display:flex;flex-direction:column;gap:14px}
.line{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--white);border:2px solid var(--line);border-radius:20px;padding:8px}
.thumb{width:56px;height:56px;border-radius:14px;overflow:hidden;background:var(--beach-soft)}
.thumb img,.thumb svg{width:100%;height:100%;object-fit:cover}
.thumb.contain img,.thumb.contain svg{object-fit:contain;padding:4px;box-sizing:border-box}
.line .nm{font-weight:800;line-height:1.25;min-width:0}
.line .nm small{display:block;color:var(--blue);font-weight:600}
.line .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.line .amt{font-weight:800;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;border:2px solid var(--navy);border-radius:999px;overflow:hidden}
.stepper button{border:0;background:var(--white);width:30px;height:28px;font-weight:800}
.stepper span{width:26px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.limit{grid-column:1/-1;margin:0;font-size:.85rem;font-weight:700;color:var(--navy);background:var(--flamingo-soft);border-radius:12px;padding:6px 10px}
.line.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-size:1.4rem;border-top:2px dashed var(--navy);padding-top:12px;text-transform:uppercase}
.total b{font-weight:400;color:var(--blue);font-variant-numeric:tabular-nums}
.form{display:grid;gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field label,.field .lab{font-weight:800;font-size:.86rem}
.field input,.field textarea,.field select{border:2px solid var(--line);background:var(--white);border-radius:14px;padding:10px 12px;width:100%;box-sizing:border-box}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);outline:none}
.seg{display:flex;gap:8px}
.seg label{flex:1;text-align:center;border:2px solid var(--line);background:var(--white);border-radius:14px;padding:9px;font-weight:800;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--navy);background:var(--sunny)}
.seg label:has(input:focus-visible){outline:3px solid var(--flamingo);outline-offset:2px}
.wa{background:#1F9D55;color:var(--white);border:2px solid var(--navy);border-radius:999px;padding:14px;text-align:center;font-weight:800;letter-spacing:.06em;text-decoration:none;box-shadow:4px 4px 0 var(--navy);display:block}
.err{color:#B3123E;font-weight:800;margin:0;font-size:.9rem}
.wa-num{display:flex;gap:8px;align-items:center;justify-content:center;font-size:.9rem;font-weight:600;flex-wrap:wrap}
.wa-num b{user-select:all;font-variant-numeric:tabular-nums}
.mini{border:1.5px solid var(--navy);background:var(--white);color:var(--navy);border-radius:999px;padding:4px 11px;font-weight:800;font-size:.78rem}
.cart-empty{text-align:center;padding:30px 10px;font-weight:600}
.cart-empty img{width:150px;margin:0 auto 12px;filter:drop-shadow(0 10px 10px rgba(20,24,80,.25))}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);background:var(--navy);color:var(--sunny);border-radius:18px;padding:11px 20px;font-weight:700;z-index:90;transition:transform .25s;width:max-content;max-width:min(420px,calc(100% - 32px));text-align:center}
.toast.on{transform:translate(-50%,0)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;display:none;background:var(--sunny);box-shadow:4px 4px 0 var(--navy)}
@media (max-width:640px){.fab.has{display:inline-flex}}

/* admin */
.admin{position:fixed;inset:0;z-index:80;background:var(--cream);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.admin-top{position:sticky;top:0;z-index:2;background:var(--blue);color:var(--sunny)}
.admin-top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.admin-top h2{font-size:1.4rem;margin-right:auto}
.admin .wrap.pad{padding-block:24px 130px}
.login{max-width:380px;margin:40px auto;background:var(--white);border:2px solid var(--navy);border-radius:26px;padding:24px;display:grid;gap:14px;box-shadow:6px 6px 0 var(--blue)}
.login h3{font-size:1.6rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.panel{background:var(--white);border:2px solid var(--navy);border-radius:24px;padding:18px;display:grid;gap:14px}
.panel h3{font-size:1.3rem}
.arow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;border-bottom:2px dotted var(--line);padding-block:10px}
.arow:last-child{border-bottom:0}
.arow .thumb{width:52px;height:52px}
.arow .meta{min-width:0;font-weight:800;line-height:1.3}
.arow .meta small{display:block;font-weight:600;color:var(--blue)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.danger{border-color:#B3123E;color:#B3123E}
.danger.arm{background:#B3123E;color:var(--white)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:96px 1fr 100px 36px;gap:8px}
.opt-h{font-size:.78rem;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.08em}
.opt input{border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--white);min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr}.arow{grid-template-columns:44px 1fr}.arow .acts{grid-column:1/-1;justify-content:flex-start}.opt{grid-template-columns:70px 1fr 76px 34px}}
.preview{width:120px;height:120px;border-radius:16px;overflow:hidden;border:2px solid var(--line);background:var(--beach-soft)}
.preview img,.preview svg{width:100%;height:100%;object-fit:cover}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--sunny);border-top:2px solid var(--navy);padding:12px var(--gutter) calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.savebar p{margin:0;font-weight:700;min-width:0}
.hint{font-size:.88rem;color:var(--blue-deep);font-weight:600;margin:0}
.note{background:var(--beach-soft);border-radius:14px;padding:10px 12px;font-size:.88rem}

/* ---------- menu ---------- */
var activeCat = "All";
var picked = {};
var cart = (store.get("bb-cart2") || []).filter(function(l){ return findItem(l.id); });

function findItem(id){ for (var i=0;i<DATA.items.length;i++) if (DATA.items[i].id === id) return DATA.items[i]; return null; }
function cats(){ var c = ["All"]; DATA.items.forEach(function(it){ if (c.indexOf(it.cat) < 0) c.push(it.cat); }); return c; }
function sizesOf(it){ var s = []; it.options.forEach(function(o){ if (o.size && s.indexOf(o.size) < 0) s.push(o.size); }); return s; }
function optName(o){ return (o.size ? o.size + " · " : "") + o.label; }
function keyOf(id, o){ return id + "|" + (o.size || "") + "|" + o.label; }
function inCart(k){ for (var i=0;i<cart.length;i++) if (cart[i].key === k) return i; return -1; }
function pickedIdx(it){ var i = picked[it.id]; return (i != null && it.options[i]) ? i : 0; }
function showLabel(it){ return it.options.length > 1 || sizesOf(it).length > 0; }

function renderChips(){
  var c = cats(); if (c.indexOf(activeCat) < 0) activeCat = "All";
  $("#chips").innerHTML = c.map(function(x){ return '<button class="chip" type="button" data-cat="' + esc(x) + '" aria-pressed="' + (x === activeCat) + '">' + esc(x) + '</button>'; }).join("");
}
function renderMenu(){
  renderChips();
  var items = DATA.items.filter(function(it){ return activeCat === "All" || it.cat === activeCat; });
  if (!items.length){ $("#grid").innerHTML = '<p class="empty-note">Nothing here yet. Message us on WhatsApp to ask what’s baking.</p>'; return; }
  $("#grid").innerHTML = items.map(function(it){
    var sel = pickedIdx(it), opt = it.options[sel] || {label:"", price:0};
    var sizes = sizesOf(it), there = inCart(keyOf(it.id, opt)) > -1;
    var sizeRow = sizes.length > 1 ? '<div class="sizes" role="group" aria-label="Size">' + sizes.map(function(s){ return '<button class="size" type="button" data-id="' + esc(it.id) + '" data-size="' + esc(s) + '" aria-pressed="' + (opt.size === s) + '">' + esc(s) + '</button>'; }).join("") + '</div>' : '';
    var list = it.options.map(function(o, i){ return {o:o, i:i}; }).filter(function(x){ return !sizes.length || x.o.size === opt.size; });
    var flav = list.length > 1 ? '<div class="flavors" role="group" aria-label="Flavour">' + list.map(function(x){
      return '<button class="flavor" type="button" data-id="' + esc(it.id) + '" data-i="' + x.i + '" aria-pressed="' + (x.i === sel) + '">' + esc(x.o.label) + ' <small>' + rupee(x.o.price) + '</small></button>'; }).join("") + '</div>' : '';
    var fit = fitOf(it);
    return '<article class="card">' +
      '<div class="tile ' + fit + '">' + media(it.img, fit).replace('alt=""', 'alt="' + esc(it.name) + '"') + (it.soldOut ? '<span class="soldout">Sold out for now</span>' : '') + '</div>' +
      '<div class="card-body"><h3>' + esc(it.name) + '</h3>' + (it.desc ? '<p class="desc">' + esc(it.desc) + '</p>' : '') + sizeRow + flav +
      '<div class="card-foot"><span class="price">' + rupee(opt.price) + '</span>' +
      '<button class="add' + (there ? ' in' : '') + '" type="button" data-add="' + esc(it.id) + '"' + (it.soldOut ? ' disabled' : '') + '>' + (it.soldOut ? 'Sold out' : there ? 'In cart ✓' : '+ Add') + '</button></div></div>' +
    '</article>';
  }).join("");
}
document.addEventListener("click", function(e){
  var t = e.target.closest("button"); if (!t || t.closest("#admin") || t.closest("#drawer")) return;
  if (t.dataset.cat){ activeCat = t.dataset.cat; renderMenu(); }
  else if (t.classList.contains("size")){ var it = findItem(t.dataset.id); for (var i=0;i<it.options.length;i++){ if (it.options[i].size === t.dataset.size){ picked[it.id] = i; break; } } renderMenu(); }
  else if (t.classList.contains("flavor")){ picked[t.dataset.id] = +t.dataset.i; renderMenu(); }
  else if (t.dataset.add){ addToCart(t.dataset.add); }
});

/* ---------- cart ---------- */
var toastTimer;
function toast(msg){ var el = $("#toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove("on"); }, 2800); }
function saveCart(){ store.set("bb-cart2", cart); }
function bump(){ ["#cartBtn","#fab"].forEach(function(s){ var b=$(s); b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }); }
function addToCart(id){
  var it = findItem(id); if (!it || it.soldOut) return;
  var o = it.options[pickedIdx(it)], k = keyOf(id, o), nm = it.name + (showLabel(it) ? " (" + optName(o) + ")" : "");
  if (inCart(k) > -1){ toast("Only one of each item per order. " + nm + " is already in your cart."); return; }
  cart.push({key:k, id:id, size:o.size || "", label:o.label, price:o.price, name:it.name});
  saveCart(); renderMenu(); renderCart(); bump();
  toast("Added " + nm + " to your cart");
}
var limitKey = null, limitTimer;
var form = store.get("bb-form") || {name:"", mode:"Delivery", date:"", addr:"", note:""};
function total(){ return cart.reduce(function(s, l){ return s + Number(l.price); }, 0); }
function lineName(l){ var it = findItem(l.id); return l.name + (it && showLabel(it) ? " (" + (l.size ? l.size + " · " : "") + l.label + ")" : ""); }
function message(){
  var lines = cart.map(function(l, i){ return (i+1) + ". " + lineName(l) + " - " + rupee(l.price); });
  var d = form.date ? new Date(form.date + "T00:00").toLocaleDateString("en-IN", {day:"numeric", month:"short", year:"numeric"}) : "";
  return "Hi The Blissfull Bites! I'd like to place an order:\n\n" + lines.join("\n") + "\n\nTotal: " + rupee(total()) +
    "\n\nName: " + form.name + "\n" + form.mode + (d ? "\nDate needed: " + d : "") + (form.mode === "Delivery" && form.addr ? "\nAddress / area: " + form.addr : "") + (form.note ? "\nNote: " + form.note : "");
}
function waHref(){ return "https://wa.me/" + DATA.whatsapp + "?text=" + encodeURIComponent(message()); }
function updateCounts(){ $("#cartCount").textContent = cart.length; $("#fabCount").textContent = cart.length; $("#fab").classList.toggle("has", cart.length > 0); }
function renderCart(){
  updateCounts();
  var b = $("#drawerBody");
  if (!cart.length){ b.innerHTML = '<div class="cart-empty"><img src="' + ASSETS.tiramisuCut + '" alt=""><p>Your cart is empty.<br>Add a few treats from the menu.</p><a class="btn btn-blue" href="#menu" id="toMenu">Browse the menu</a></div>'; return; }
  var today = new Date(); today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
  b.innerHTML = cart.map(function(l){
    var it = findItem(l.id) || {options:[]}; var multi = showLabel(it);
    return '<div class="line" data-key="' + esc(l.key) + '"><div class="thumb ' + fitOf(it) + '">' + media(it.img, fitOf(it)) + '</div><div class="nm">' + esc(l.name) + (multi ? '<small>' + esc((l.size ? l.size + " · " : "") + l.label) + '</small>' : '') + '</div>' +
      '<div class="rt"><span class="amt">' + rupee(l.price) + '</span><div class="stepper"><button type="button" data-dec="' + esc(l.key) + '" aria-label="Remove ' + esc(l.name) + '">−</button><span>1</span><button type="button" data-inc="' + esc(l.key) + '" aria-label="Add another ' + esc(l.name) + '">+</button></div></div>' +
      (limitKey === l.key ? '<p class="limit">Only one per item. Need more? Mention it in the note below.</p>' : '') + '</div>';
  }).join("") +
  '<div class="total"><span>Total</span><b>' + rupee(total()) + '</b></div>' +
  '<form class="form" id="orderForm" novalidate>' +
    '<div class="field"><label for="o-name">Your name</label><input id="o-name" autocomplete="name" value="' + esc(form.name) + '" placeholder="e.g. Riya"></div>' +
    '<div class="field"><span class="lab">How do you want it?</span><div class="seg" role="radiogroup" aria-label="Delivery or pickup">' +
      ['Delivery','Pickup'].map(function(m){ return '<label><input type="radio" name="o-mode" id="o-mode-' + m + '" value="' + m + '"' + (form.mode === m ? ' checked' : '') + '><span>' + m + '</span></label>'; }).join("") + '</div></div>' +
    '<div class="field"><label for="o-date">Date needed</label><input type="date" id="o-date" min="' + today.toISOString().slice(0,10) + '" value="' + esc(form.date) + '"></div>' +
    (form.mode === "Delivery" ? '<div class="field"><label for="o-addr">Delivery address or area</label><input id="o-addr" value="' + esc(form.addr) + '" placeholder="e.g. Janakpuri, West Delhi"></div>' : '') +
    '<div class="field"><label for="o-note">Note (optional)</label><input id="o-note" value="' + esc(form.note) + '" placeholder="Message on the cake, extra quantity, timing"></div>' +
    '<p class="err" id="orderErr" hidden></p>' +
    '<a class="wa" id="waBtn" href="' + esc(waHref()) + '" target="_blank" rel="noopener">Send order on WhatsApp</a>' +
    '<div class="wa-num">Orders go to <b>' + NUM + '</b><button class="mini" type="button" id="copyOrder">Copy order text</button></div>' +
  '</form>';
}
function readForm(){
  var g = function(id){ var el = document.getElementById(id); return el ? el.value.trim() : null; };
  form.name = g("o-name") || ""; form.date = g("o-date") || "";
  var addr = g("o-addr"); if (addr !== null) form.addr = addr;
  form.note = g("o-note") || "";
  var m = $('input[name="o-mode"]:checked'); if (m) form.mode = m.value;
  store.set("bb-form", form);
  var a = $("#waBtn"); if (a) a.href = waHref();
}
function openCart(){ renderCart(); $("#drawer").classList.add("on"); $("#scrim").classList.add("on"); $("#drawer").setAttribute("aria-hidden","false"); setTimeout(function(){ $("#closeCart").focus(); }, 50); }
function closeCart(){ $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); $("#drawer").setAttribute("aria-hidden","true"); }
$("#cartBtn").addEventListener("click", openCart);
$("#fab").addEventListener("click", openCart);
$("#waTop").addEventListener("click", function(e){ if (cart.length){ e.preventDefault(); openCart(); } });
$("#closeCart").addEventListener("click", closeCart);
$("#scrim").addEventListener("click", closeCart);
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeCart(); });
$("#drawer").addEventListener("input", readForm);
$("#drawer").addEventListener("change", function(e){ readForm(); if (e.target.name === "o-mode"){ renderCart(); } });
$("#drawer").addEventListener("click", function(e){
  var t = e.target.closest("button, a"); if (!t) return;
  if (t.id === "toMenu"){ closeCart(); return; }
  if (t.dataset.dec){ var i = inCart(t.dataset.dec); if (i > -1){ cart.splice(i,1); saveCart(); renderCart(); renderMenu(); } return; }
  if (t.dataset.inc){
    limitKey = t.dataset.inc; renderCart(); var row = $('.line[data-key="' + CSS.escape(limitKey) + '"]'); if (row) row.classList.add("shake");
    clearTimeout(limitTimer); limitTimer = setTimeout(function(){ limitKey = null; var p = $(".limit"); if (p) p.remove(); }, 3500); return;
  }
  if (t.id === "copyOrder"){
    readForm(); var txt = message();
    try { navigator.clipboard.writeText(txt).then(function(){ toast("Order copied. Paste it in WhatsApp to " + NUM + "."); }, function(){ toast("Copy didn't work here. Use the green button instead."); }); }
    catch(err){ toast("Copy didn't work here. Use the green button instead."); }
    return;
  }
  if (t.id === "waBtn"){
    readForm();
    var err = !form.name ? "Add your name so we know who the order is for." : !form.date ? "Pick the date you need your order." : (form.mode === "Delivery" && !form.addr) ? "Add your delivery address or area." : "";
    var el = $("#orderErr");
    if (err){ e.preventDefault(); el.textContent = err; el.hidden = false; return; }
    el.hidden = true; toast("Opening WhatsApp with your order…");
  }
});

var cyrb53 = function(str, seed){ seed = seed || 7; var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed; for (var i=0, ch; i<str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1>>>16), 2246822507); h1 ^= Math.imul(h2 ^ (h2>>>13), 3266489909); h2 = Math.imul(h2 ^ (h2>>>16), 2246822507); h2 ^= Math.imul(h1 ^ (h1>>>13), 3266489909); return (4294967296 * (2097151 & h2) + (h1>>>0)).toString(36); };

        return '<div class="arow"><div class="thumb ' + fitOf(it) + '">' + media(it.img, fitOf(it)) + '</div><div class="meta">' + esc(it.name) + (it.soldOut ? ' · <span style="color:#B3123E">sold out</span>' : '') + '<small>' + esc(it.cat) + ' · ' + (lo === hi ? rupee(lo) : rupee(lo) + "–" + rupee(hi)) + ' · ' + it.options.length + ' option' + (it.options.length > 1 ? 's' : '') + '</small></div>' +

      }).join("") + '<button class="btn btn-white" type="button" data-new="1" style="justify-self:start">+ Add new item</button></div>';
  } else if (tab === "edit"){

    body += '<form class="panel" id="itemForm" novalidate><h3>' + (e.id ? 'Edit ' + esc(e.name) : 'Add a new item') + '</h3>' +
      '<div class="two"><div class="field"><label for="i-name">Item name</label><input id="i-name" value="' + esc(e.name) + '" placeholder="e.g. Red Velvet Jar"></div>' +
      '<div class="field"><label for="i-cat">Category</label><input id="i-cat" list="i-cats" value="' + esc(e.cat) + '" placeholder="e.g. Cakes"><datalist id="i-cats">' + catList.map(function(c){ return '<option value="' + esc(c) + '">'; }).join("") + '</datalist></div></div>' +
      '<div class="field"><label for="i-desc">Short description (optional)</label><input id="i-desc" value="' + esc(e.desc) + '" placeholder="One line customers will see"></div>' +
      '<div class="field"><label for="i-photo">Photo</label><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">' + (e.img ? '<div class="preview">' + media(e.img, "cover") + '</div>' : '') + '<input id="i-photo" type="file" accept="image/*"></div><p class="hint">Phone photos are fine; they are resized automatically.</p></div>' +
      '<div class="field"><span class="lab">Options and prices (₹)</span><div class="opts" id="opts"><div class="opt opt-h"><span>Size</span><span>Flavour</span><span>Price</span><span></span></div>' + e.options.map(function(o, i){ return '<div class="opt"><input id="o-s-' + i + '" value="' + esc(o.size || "") + '" placeholder="500g" aria-label="Size ' + (i+1) + '"><input id="o-l-' + i + '" value="' + esc(o.label) + '" placeholder="e.g. Nutella" aria-label="Flavour ' + (i+1) + '"><input id="o-p-' + i + '" type="number" inputmode="numeric" min="0" value="' + esc(o.price) + '" placeholder="Price" aria-label="Price ' + (i+1) + '"><button class="x" type="button" data-rmopt="' + i + '" aria-label="Remove option" style="width:34px;height:34px">×</button></div>'; }).join("") + '</div>' +
      '<button class="mini" type="button" id="addOpt" style="justify-self:start">+ Add option</button><p class="hint">Leave Size empty if the item comes in one size. Fill it in (Bento, 500g, 1kg) to show size buttons on the card.</p></div>' +
      '<p class="err" id="itemErr" hidden></p>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-blue" type="submit">' + (e.id ? 'Save changes' : 'Add to menu') + '</button><button class="btn btn-white" type="button" id="cancelEdit">Cancel</button></div></form>';
  } else {
    body += '<form class="panel" id="revForm" novalidate><h3>Add a review</h3><p class="hint">Copy a comment or DM from Instagram, or upload its screenshot. Add only real reviews from customers.</p>' +
      '<div class="two"><div class="field"><label for="r-handle">Instagram handle</label><input id="r-handle" placeholder="@customer.handle"></div>' +
      '<div class="field"><label for="r-rate">Stars (optional)</label><select id="r-rate"><option value="">No stars</option><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option></select></div></div>' +
      '<div class="field"><label for="r-text">What they said</label><textarea id="r-text" rows="3" placeholder="Paste their words"></textarea></div>' +
      '<div class="field"><label for="r-img">Screenshot (optional)</label><input id="r-img" type="file" accept="image/*"></div>' +
      '<p class="err" id="revErr" hidden></p><button class="btn btn-blue" type="submit" style="justify-self:start">Add review</button></form>' +
      '<div class="panel" style="margin-top:16px"><h3>On the website (' + (DATA.reviews || []).length + ')</h3>' +
      ((DATA.reviews || []).length ? DATA.reviews.map(function(r){ return '<div class="arow"><div class="thumb">' + (r.img ? '<img src="' + esc(r.img) + '" alt="">' : '') + '</div><div class="meta">@' + esc(r.handle.replace(/^@/,"")) + '<small>' + esc((r.text || "Screenshot").slice(0,90)) + '</small></div><div class="acts"><button class="mini danger' + (armed === r.id ? ' arm' : '') + '" type="button" data-rdel="' + esc(r.id) + '">' + (armed === r.id ? 'Tap again to remove' : 'Remove') + '</button></div></div>'; }).join("") : '<p class="hint">No reviews yet. The website shows a link to your Instagram until you add some.</p>') + '</div>';
  }
  var bar = '<div class="savebar"><p>' + (status ? esc(status) : dirty ? dirty + ' unpublished change' + (dirty > 1 ? 's' : '') + '. Customers see them after you publish.' : 'Everything is live.') + '</p><button class="btn btn-blue" type="button" id="publishBtn"' + (dirty ? '' : ' disabled style="opacity:.5"') + '>Publish to website</button></div>';
  a.innerHTML = top + '<div class="wrap pad">' + body + '<p class="note" style="margin-top:20px">Unpublished changes are lost if you close or reload this page.</p></div>' + bar;
}
function changed(msg){ dirty++; status = ""; renderMenu(); renderReviews(); renderAdmin(); if (msg) toast(msg); }
function slug(s){ var b = s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "item", id = b, n = 2; while (findItem(id)) id = b + "-" + (n++); return id; }
function compress(file, max){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = rej;
    fr.onload = function(){ var im = new Image(); im.onerror = rej; im.onload = function(){
      var s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(im, 0, 0, c.width, c.height);
      var u = c.toDataURL("image/webp", 0.76); if (u.indexOf("data:image/webp") !== 0) u = c.toDataURL("image/jpeg", 0.8); res(u);
    }; im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
function syncEditing(){
  if (!editing) return;
  var g = function(id){ var el = document.getElementById(id); return el ? el.value : ""; };
  editing.name = g("i-name"); editing.cat = g("i-cat"); editing.desc = g("i-desc");
  editing.options = editing.options.map(function(o, i){ return {size: g("o-s-" + i), label: g("o-l-" + i), price: g("o-p-" + i)}; });
}
$("#admin").addEventListener("submit", function(e){
  e.preventDefault();
  var f = e.target;
  if (f.id === "loginForm"){
    var k = $("#a-key").value.trim(), p = $("#a-pass").value;
    if (cyrb53(k + "|" + p) === ADMIN_HASH){ authed = true; store.sset("bb-admin", "1"); renderAdmin(); }
    else $("#loginErr").hidden = false;
  }
  if (f.id === "itemForm"){
    syncEditing();
    var e2 = editing, err = "";
    e2.name = e2.name.trim(); e2.cat = e2.cat.trim() || "Treats"; e2.desc = e2.desc.trim();
    e2.options = e2.options.filter(function(o){ return o.label.trim() || o.size.trim() || String(o.price).trim(); }).map(function(o){ var r = {label:o.label.trim() || o.size.trim() || "Classic", price: Number(o.price)}; if (o.size.trim() && o.label.trim()) r.size = o.size.trim(); return r; });
    if (!e2.name) err = "Give the item a name.";
    else if (!e2.options.length) err = "Add at least one option with a price.";
    else if (e2.options.some(function(o){ return !(o.price > 0); })) err = "Every option needs a price above ₹0.";
    else if (!e2.img) err = "Add a photo so customers can see it.";
    if (err){ if (!e2.options.length) e2.options = [{size:"", label:"", price:""}]; renderAdmin(); var el = $("#itemErr"); el.textContent = err; el.hidden = false; return; }
    var isNew = !e2.id;
    if (isNew){ e2.id = slug(e2.name); DATA.items.push(e2); }
    else { for (var i=0;i<DATA.items.length;i++) if (DATA.items[i].id === e2.id) DATA.items[i] = e2; }
    var nm = e2.name; editing = null; tab = "menu"; changed(isNew ? nm + " added. Publish to show it to customers." : nm + " updated.");
  }
  if (f.id === "revForm"){
    var h = $("#r-handle").value.trim().replace(/^@/, ""), tx = $("#r-text").value.trim(), rate = Number($("#r-rate").value) || 0, file = $("#r-img").files[0];
    var showErr = function(m){ var el = $("#revErr"); el.textContent = m; el.hidden = false; };
    if (!h) return showErr("Add the customer’s Instagram handle.");
    if (!tx && !file) return showErr("Paste what they said or add a screenshot.");
    var done = function(img){ DATA.reviews = DATA.reviews || []; DATA.reviews.unshift({id: "r" + Date.now().toString(36), handle: h, text: tx, rating: rate, img: img || ""}); changed("Review added."); };
    if (file) compress(file, 640).then(done, function(){ showErr("That image couldn’t be read. Try a PNG or JPG screenshot."); }); else done("");
  }
});
$("#admin").addEventListener("change", function(e){
  if (e.target.id === "i-photo" && e.target.files[0]){
    syncEditing();
    compress(e.target.files[0], 720).then(function(u){ editing.img = u; editing.fit = "cover"; renderAdmin(); }, function(){ toast("That photo couldn’t be read. Try a JPG or PNG."); });
  }
});
$("#admin").addEventListener("click", function(e){
  var t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tab){ if (tab === "edit") syncEditing(); tab = t.dataset.tab; armed = null; renderAdmin(); return; }
  if (t.dataset.new){ editing = blankItem(); tab = "edit"; renderAdmin(); return; }
  if (t.dataset.edit){ editing = JSON.parse(JSON.stringify(findItem(t.dataset.edit))); editing.options.forEach(function(o){ o.size = o.size || ""; }); tab = "edit"; renderAdmin(); return; }
  if (t.dataset.sold){ var it = findItem(t.dataset.sold); it.soldOut = !it.soldOut; changed(it.name + (it.soldOut ? " marked sold out." : " is back in stock.")); return; }
  if (t.dataset.del){
    if (armed !== t.dataset.del){ armed = t.dataset.del; renderAdmin(); return; }
    var nm = findItem(armed).name; DATA.items = DATA.items.filter(function(x){ return x.id !== armed; }); cart = cart.filter(function(l){ return l.id !== armed; }); saveCart(); updateCounts(); armed = null; changed(nm + " removed."); return;
  }
  if (t.dataset.rdel){
    if (armed !== t.dataset.rdel){ armed = t.dataset.rdel; renderAdmin(); return; }
    DATA.reviews = DATA.reviews.filter(function(r){ return r.id !== armed; }); armed = null; changed("Review removed."); return;
  }
  if (t.id === "addOpt"){ syncEditing(); var last = editing.options[editing.options.length - 1] || {}; editing.options.push({size: last.size || "", label:"", price:""}); renderAdmin(); var inp = $("#o-l-" + (editing.options.length - 1)); if (inp) inp.focus(); return; }
  if (t.dataset.rmopt){ syncEditing(); editing.options.splice(+t.dataset.rmopt, 1); if (!editing.options.length) editing.options.push({size:"", label:"", price:""}); renderAdmin(); return; }
  if (t.id === "cancelEdit"){ editing = null; tab = "menu"; renderAdmin(); return; }
  if (t.id === "publishBtn"){ publish(); }
});

function buildPage(){
  var resetCss = "";
  $$("head style").some(function(s){ if (s.textContent.indexOf("safe-area-inset") > -1){ resetCss = s.textContent; return true; } return false; });
  if (!resetCss) resetCss = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}";
  var dataTxt = JSON.stringify(DATA).replace(/</g, "\\u003c");
  var tag = "script";
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + resetCss + '</style></head><body>' +
    '<title>The Blissfull Bites</title>' + document.getElementById("bb-fonts").outerHTML +
    '<style id="bb-css">' + document.getElementById("bb-css").textContent + '</style><div id="app"></div>' +
    '<' + tag + ' type="application/json" id="bb-assets">' + document.getElementById("bb-assets").textContent + '</' + tag + '>' +
    '<' + tag + ' type="application/json" id="bb-data">' + dataTxt + '</' + tag + '>' +
    '<' + tag + ' id="bb-js">' + document.getElementById("bb-js").textContent + '</' + tag + '>' +
    '</body></html>';
}
function publish(){
  var btn = $("#publishBtn"); btn.disabled = true; btn.textContent = "Publishing…";
  var fail = function(m){ status = m; renderAdmin(); };
  var api = window.claude && window.claude.use ? window.claude.use("artifact") : Promise.resolve(null);
  Promise.resolve(api).then(function(art){
    if (!art) return fail("Publishing works only when this page is open in Claude, signed in as the site owner.");
    return art.publish(buildPage()).then(function(){ dirty = 0; status = "Published. The website is reloading with your changes…"; renderAdmin(); }, function(err){
      var c = err && err.code;
      if (c === "conflict") fail("A newer version was published a moment ago. The page is reloading; make your change again after it loads.");
      else if (c === "not_writer" || c === "not_granted" || c === "consent_required" || c === "capability_disabled" || c === "not_declared") fail("This account can view the site but can’t publish it. Open it signed in to Claude as the site owner.");
      else if (c === "too_large") fail("The site is too large to publish. Remove a few photos or reviews and try again.");
      else if (c === "rate_limited") fail("Publishing too often. Wait a minute, then publish again.");
      else fail("Publishing didn’t go through. Wait a moment and press Publish again.");
    });
  });
}

renderMenu(); renderReviews(); updateCounts(); routeAdmin();
})();
